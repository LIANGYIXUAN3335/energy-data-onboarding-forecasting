[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-ai-data-onboarding"
version = "0.1.0"
description = "Auditable, deterministic onboarding for public building-energy data."
readme = "README.md"
authors = [{ name = "Yixuan Liang", email = "liangyixuan333@gmail.com" }]
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10"]

[project.scripts]
energy-onboard = "energy_onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:invalid value encountered in cast:RuntimeWarning",
  # pandas < 3.0 emits this from its own Timedelta arithmetic on numpy >= 2.5;
  # harmless here and fixed upstream in pandas 3.0.
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
