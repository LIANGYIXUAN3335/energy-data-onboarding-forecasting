[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-demand-forecasting"
version = "0.1.0"
description = "Reproducible day-ahead electricity demand forecasting experiments over versioned onboarding outputs"
readme = "README.md"
authors = [{ name = "Yixuan Liang", email = "liangyixuan333@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
energy-forecast = "energy_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
